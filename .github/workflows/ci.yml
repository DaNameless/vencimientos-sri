name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + mutación)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vencimientos
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uapp -papp"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: vencimientos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pruebas unitarias y de integración
        run: pytest -v
      - name: Pruebas de mutación (falla si sobrevive algún mutante)
        run: |
          mutmut run
          sobrevivientes="$(mutmut results)"
          if [ -n "$sobrevivientes" ]; then echo "$sobrevivientes"; exit 1; fi

  frontend:
    name: Frontend (contrato + tipos + pruebas + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r ../requirements.txt
      - run: npm ci
      - name: Contrato API → tipos TypeScript al día
        # Si alguien cambia la API sin regenerar los tipos del frontend, esto falla.
        run: |
          python ../scripts/exportar_openapi.py
          npm run gen:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
